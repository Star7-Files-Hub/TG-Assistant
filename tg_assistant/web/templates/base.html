<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TG-Assistant{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ static_version }}">
</head>
<body>
    <div class="app-layout">
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">TG</div>
                <span class="sidebar-brand">TG-Assistant</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-item {% if page == 'dashboard' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    仪表盘
                </a>
                <a href="/login" class="nav-item {% if page == 'login' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg>
                    扫码登录
                </a>
                <a href="/accounts" class="nav-item {% if page == 'accounts' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                    账号管理
                </a>
                <button type="button"
                        class="nav-group-title nav-group-toggle"
                        id="nav-group-listen"
                        aria-controls="nav-submenu-listen"
                        aria-expanded="true"
                        data-submenu="nav-submenu-listen"
                        title="展开 / 收起监听任务"
                        onclick="toggleNavGroup(this)">
                    <svg class="nav-group-leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 010 8.49m-8.48-.01a6 6 0 010-8.49m11.31-2.82a10 10 0 010 14.14m-14.14 0a10 10 0 010-14.14"/></svg>
                    <span>监听任务</span>
                    <svg class="nav-group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="nav-submenu" id="nav-submenu-listen">
                    <a href="/rules" class="nav-item {% if page == 'rules' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                        转发规则
                    </a>
                    <a href="/red_packet" class="nav-item {% if page == 'red_packet' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
                        抢红包
                    </a>
                    <a href="/reg_grab" class="nav-item {% if page == 'reg_grab' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777z"/><path d="M15.5 7.5l3 3L22 7l-3-3"/></svg>
                        抢注任务
                    </a>
                </div>
                <a href="/notify" class="nav-item {% if page == 'notify' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
                    通知设置
                </a>
                <a href="/cloudflare_ip" class="nav-item {% if page == 'cloudflare_ip' %}active{% endif %}">
                     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                     优选 IP
                 </a>
                 <a href="/logs" class="nav-item {% if page == 'logs' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                    实时日志
                </a>
                <a href="/proxy" class="nav-item {% if page == 'proxy' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                    代理检查
                </a>
            </nav>
            <div class="sidebar-footer">
                <span id="run-status" class="badge">● 未运行</span>
                {% if request.app.state.web_settings.secret_key %}
                <form method="post" action="/auth/logout">
                    <button type="submit" class="nav-item sidebar-logout" title="清除访问密钥 Cookie">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        退出登录
                    </button>
                </form>
                {% endif %}
            </div>
        </aside>
        <main class="main-content">
            <button class="sidebar-toggle" onclick="toggleSidebar()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            {% block content %}{% endblock %}
        </main>
    </div>
    <div id="toast" class="toast toast-hidden"></div>
    <script src="/static/js/app.js?v={{ static_version }}"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('show');
        }

        /* ---- 可折叠的侧边栏分组（例：监听任务） ----
           ⚠️ 子菜单的 id 由按钮的 ``data-submenu`` 给出，不要拼字符串
           （``'nav-submenu-' + id`` 这种写法一旦拼错，getElementById 返回 null，
           页面上表现为「点了没反应」，而模板照样渲染、测试也全绿）。
        */

        function navGroupMenu(btn) {
            return document.getElementById(btn.getAttribute('data-submenu'));
        }

        function navGroupKey(btn) {
            return 'tga.navgroup.' + btn.id;
        }

        function setNavGroup(btn, expanded) {
            var menu = navGroupMenu(btn);
            if (!menu) return;
            btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
            menu.classList.toggle('collapsed', !expanded);
        }

        function toggleNavGroup(btn) {
            var expanded = btn.getAttribute('aria-expanded') === 'true';
            setNavGroup(btn, !expanded);
            try {
                localStorage.setItem(navGroupKey(btn), expanded ? '0' : '1');
            } catch (e) {
                /* 隐私模式下 localStorage 会抛异常 —— 不影响本次折叠 */
            }
        }

        function initNavGroups() {
            document.querySelectorAll('.nav-group-toggle').forEach(function (btn) {
                var menu = navGroupMenu(btn);
                var stored = null;
                try {
                    stored = localStorage.getItem(navGroupKey(btn));
                } catch (e) {
                    stored = null;
                }
                // 当前页就在这个分组里 ⇒ 必须展开。否则用户收起后跳到「转发规则」，
                // 侧边栏里连自己在哪一页都看不出来。
                var hasActive = !!menu && menu.querySelector('.nav-item.active') !== null;
                setNavGroup(btn, hasActive || stored === null || stored === '1');
            });
        }

        document.addEventListener('DOMContentLoaded', initNavGroups);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
